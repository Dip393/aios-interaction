[package]
name = "aios-runtime"
version = "0.2.0"
description = "AIOS Runtime - Intent-driven AI operating environment"
authors = ["AIOS"]
edition = "2021"

[lib]
name = "aios_runtime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.3", features = [] }

[dependencies]
tauri = { version = "2.5", features = [] }
tauri-plugin-shell = "2.2"
enigo = "0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
